
bundle:
  name: forecastiq

# ---------------------------------------------------------------------
# Variables — every environment-specific value lives here, not inline.
# Override per target below, or on the CLI: --var="key=value".
# ---------------------------------------------------------------------
variables:
  compute_job_name:
    description: >-
      Display name of the dev-only Ray key-parallel Job below. Deployed for
      manual/CLI use — the application itself submits every cloud run
      through jobs.submit (backend/app/orchestration/databricks_runner.py),
      never by resolving or triggering a job by name.
    default: forecastiq-forecast-pipeline-compute

  existing_cluster_id:
    description: >-
      Cluster id of an ALREADY EXISTING all-purpose cluster for the key-parallel
      job. Nothing here ever creates a cluster.
      Override with --var or BUNDLE_VAR_existing_cluster_id before actually
      running this dev-only job. The default below is a deliberately
      invalid placeholder, not a real cluster: `bundle validate` requires
      one of job_cluster_key/environment_key/existing_cluster_id/new_cluster
      to be genuinely non-empty (an empty string fails validation as
      "missing"), so this can't default to blank the way every other
      optional variable here does — it still fails loudly and clearly
      ("cluster does not exist") if actually deployed and run unoverridden.
      Never reaches prod: this variable has no consumer outside the dev
      target's job resource below.
    default: "REPLACE_WITH_REAL_CLUSTER_ID"


  catalog:
    description: Existing Unity Catalog catalog.
    default: forecastiq

  schema:
    description: Existing Unity Catalog schema.
    default: forecasting


  volume:
    description: Existing Unity Catalog external volume holding the original uploaded datasets.
    default: upload_files


  mlflow_experiment:
    description: MLflow experiment path in the Databricks workspace.
    default: /Shared/forecastiq/forecast-engine

 
  azure_openai_endpoint:
    description: Value for AZURE_OPENAI_ENDPOINT. Empty disables LLM insights.
    default: ""

  azure_openai_api_key:
    description: Value for AZURE_OPENAI_API_KEY. Empty disables LLM insights.
    default: ""

  azure_openai_deployment:
    description: Value for AZURE_OPENAI_DEPLOYMENT_NAME. Empty disables LLM insights.
    default: ""

  volumes_root:
    description: >-
      Unity Catalog Volume root. forecast_engine reads and writes with
      pandas/pathlib, which need POSIX paths — UC Volumes provide those over the
      existing ADLS containers, where abfss:// URIs would not be directly
      readable. A UC volume path is /Volumes/<catalog>/<schema>/<volume>, so the
      volume name must be included: forecastiq.forecasting.upload_files is an
      EXTERNAL volume over the deployment's `uploads` container.
    default: /Volumes/${var.catalog}/${var.schema}/${var.volume}

  cicd_service_principal_id:
    description: >-
      Application (client) id of the CI/CD service principal — the same one
      CI/CD authenticates as, and the same one the backend authenticates as
      at runtime. Used to scope the `prod` target's workspace `root_path`
      under that principal's own folder rather than a shared one.

      Intentionally has no default: the id identifies the Azure tenant, so it
      is supplied by the environment rather than committed. Set
      BUNDLE_VAR_cicd_service_principal_id (see .env.example) or pass
      --var="cicd_service_principal_id=...". A missing value fails
      validation immediately rather than deploying to the wrong path.


# ---------------------------------------------------------------------
artifacts:
  forecast_engine_wheel:
    type: whl
    path: ..
    
    build: python3 -m pip wheel . --no-deps --wheel-dir dist

# ---------------------------------------------------------------------
# Targets
# ---------------------------------------------------------------------
targets:
  dev:
    mode: development
    default: true
    workspace:
      
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:

      azure_openai_endpoint: "{{secrets/forecastiq/azure-openai-endpoint}}"
      azure_openai_api_key: "{{secrets/forecastiq/azure-openai-api-key}}"
      azure_openai_deployment: "{{secrets/forecastiq/azure-openai-deployment}}"

    # Declared under `dev` rather than in resources/ on purpose: a resources/
    # file is included by every target, and this job must never reach prod.
    #
    # Deployed for manual/CLI use only (`databricks bundle run
    # forecast_pipeline_compute -t dev`) — the application never triggers a
    # job by name or id. Every cloud run the backend submits goes through
    # jobs.submit with an ad-hoc single task instead (see
    # backend/app/orchestration/databricks_runner.py); this resource is not
    # part of that path.
    resources:
      jobs:
        forecast_pipeline_compute:
          name: ${var.compute_job_name}
          description: >-
            Runs the whole forecast_engine pipeline in ONE task on an existing
            all-purpose cluster, fanning each forecast key's complete workflow
            out across Ray. One process, so no cross-task checkpoints.

          parameters:
            - name: dataset
              default: ""
            - name: config
              default: ""
            - name: summary_out
              default: ${var.volumes_root}/runs/{{job.run_id}}/summary.json
            - name: live_status_out
              default: ${var.volumes_root}/runs/{{job.run_id}}/live_status.json
            - name: azure_openai_endpoint
              default: ${var.azure_openai_endpoint}
            - name: azure_openai_api_key
              default: ${var.azure_openai_api_key}
            - name: azure_openai_deployment
              default: ${var.azure_openai_deployment}

          tasks:
            - task_key: forecast_pipeline
              # An id that must already exist — this creates no compute.
              existing_cluster_id: ${var.existing_cluster_id}
              python_wheel_task:
                package_name: forecast_engine
                entry_point: forecast-engine
                parameters:
                  - --dataset
                  - "{{job.parameters.dataset}}"
                  - --config
                  - "{{job.parameters.config}}"
                  - --summary-out
                  - "{{job.parameters.summary_out}}"
                  - --live-status-out
                  - "{{job.parameters.live_status_out}}"
                  - --azure-openai-endpoint
                  - "{{job.parameters.azure_openai_endpoint}}"
                  - --azure-openai-api-key
                  - "{{job.parameters.azure_openai_api_key}}"
                  - --azure-openai-deployment
                  - "{{job.parameters.azure_openai_deployment}}"
                  - --parallel-keys
              # The wheel alone, with no extras. A Databricks ML runtime
              # already ships Ray, statsmodels, xgboost, lightgbm, prophet,
              # shap, openai and mlflow-skinny, so naming them here only
              # re-resolves versions the runtime pins — which rewrites its
              # scientific stack and moves pydantic across a major. The
              # wheel's own base dependencies are already satisfied except
              # for openpyxl.
              libraries:
                - whl: ../dist/*.whl

          max_concurrent_runs: 1
          queue:
            enabled: true

  prod:
    mode: production
    workspace:
     
      root_path: /Workspace/Users/${var.cicd_service_principal_id}/.bundle/${bundle.name}/${bundle.target}
    
    variables:
      azure_openai_endpoint: "{{secrets/forecastiq/azure-openai-endpoint}}"
      azure_openai_api_key: "{{secrets/forecastiq/azure-openai-api-key}}"
      azure_openai_deployment: "{{secrets/forecastiq/azure-openai-deployment}}"
