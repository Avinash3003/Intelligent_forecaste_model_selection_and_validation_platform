# ForecastIQ — forecast pipeline Job.
#
# ONE task running the complete existing forecast_engine workflow. The engine
# already sequences all 14 stages internally, so splitting it into Databricks
# tasks here would duplicate that orchestration; the first cloud deployment
# runs it as a single reliable unit.

resources:
  jobs:
    forecast_pipeline:
      name: ${var.job_name}
      description: >-
        Runs the complete forecast_engine pipeline (load -> preprocess -> train ->
        evaluate -> explain -> rank -> drift-gate -> select -> insights -> MLflow)
        as a single task on a Databricks Container Services cluster.

      # -----------------------------------------------------------------
      # Job parameters. Names mirror the existing forecast_engine CLI flags
      # (forecast_engine/run_pipeline.py) — nothing invented here.
      # Override per run: databricks bundle run ... --params dataset=...,horizon=12
      # -----------------------------------------------------------------
      parameters:
        - name: dataset
          # --dataset. POSIX path in the UC external volume over the ADLS
          # `uploads` container. No default on purpose: a default here would
          # make an operator who forgets `--params` silently forecast whatever
          # file the last person happened to name, and report success. An
          # empty value fails the task immediately instead.
          default: ""

        - name: config
          # --config. JSON forecast configuration, the exact payload the backend's
          # Metadata Interpreter already emits. This is the recommended entry path:
          # it carries key_columns/feature_columns as JSON arrays, which a single
          # flat job parameter cannot express (see report for detail).
          # Empty string = not used; the explicit column flags below apply instead.
          default: ""

        - name: date_column
          # --date-column. Dataset-specific, so it carries no default for the
          # same reason as `dataset` above.
          default: ""

        - name: target_column
          # --target-column. Dataset-specific; no default.
          default: ""

        - name: key_columns
          # --key-columns. Space-separated values are passed as ONE argparse token,
          # so this reliably carries a single key column only. Use `config` above
          # for composite business keys.
          default: ""

        - name: feature_columns
          default: "" # --feature-columns, same single-value caveat as key_columns

        - name: aggregation_method
          default: sum # --aggregation-method: sum | mean | last

        - name: horizon
          default: "12" # --horizon, 6-60

        - name: models
          # --models. Same single-value caveat; empty = train every registered model.
          default: ""

        - name: fallback_model
          default: "" # --fallback-model; empty = configured baseline (seasonal_naive)

        - name: run_id
          default: "" # --run-id; empty = engine generates fe-run-<uuid>

        - name: dataset_name
          default: "" # --dataset-name, recorded with the MLflow run

        - name: summary_out
          # --summary-out. Partitioned by Databricks run id: a fixed filename
          # meant every run overwrote the previous run's summary, so only the
          # most recent one was ever readable. `{{job.run_id}}` is substituted
          # by Databricks at launch.
          #
          # Written inside forecast_files because that is currently the only UC
          # volume defined; a dedicated volume over the `artifacts` container
          # would be the eventual home.
          default: ${var.volumes_root}/runs/{{job.run_id}}/summary.json

      tasks:
        - task_key: run_forecast_pipeline
          job_cluster_key: forecast_engine_cluster

          # Console script declared in pyproject.toml:
          #   [project.scripts] forecast-engine = "forecast_engine.run_pipeline:main"
          python_wheel_task:
            package_name: forecast_engine
            entry_point: forecast-engine
            parameters:
              - --dataset
              - "{{job.parameters.dataset}}"
              - --date-column
              - "{{job.parameters.date_column}}"
              - --target-column
              - "{{job.parameters.target_column}}"
              - --aggregation-method
              - "{{job.parameters.aggregation_method}}"
              - --horizon
              - "{{job.parameters.horizon}}"
              - --summary-out
              - "{{job.parameters.summary_out}}"

          libraries:
            # Built and uploaded by this bundle — never uploaded by hand.
            - whl: ../../dist/*.whl

      job_clusters:
        - job_cluster_key: forecast_engine_cluster
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: ${var.node_type_id}

            # Single node: forecast_engine is single-process Python (pandas/sklearn),
            # not a Spark job — workers would idle. One 8 vCPU / 32 GB driver.
            num_workers: 0
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: "local[*]"
            custom_tags:
              ResourceClass: SingleNode

            # Databricks Container Services. Credentials are secret references,
            # never literals — see the report for the required scope/keys.
            docker_image:
              url: ${var.acr_image}:${var.acr_image_tag}
              basic_auth:
                username: "{{secrets/${var.secret_scope}/acr-username}}"
                password: "{{secrets/${var.secret_scope}/acr-password}}"

            # Required for Unity Catalog access from a DCS cluster; DCS is not
            # supported on Shared/standard access mode.
            data_security_mode: SINGLE_USER

            spark_env_vars:
              # MLflow -> Databricks tracking. forecast_engine's MLflowConfig reads
              # exactly these names and stays environment-agnostic; setting them
              # here is what replaces its local sqlite/mlruns defaults. Without
              # them the engine would silently write to a throwaway local store
              # inside the container and lose every run.
              MLFLOW_TRACKING_URI: databricks
              MLFLOW_REGISTRY_URI: databricks-uc
              MLFLOW_EXPERIMENT_NAME: ${var.mlflow_experiment}

              # Azure OpenAI (LLM business insights). Driven by variables rather
              # than a hardcoded {{secrets/...}} reference: Databricks resolves
              # those during cluster init, before Python starts, so referencing a
              # secret that does not exist fails the whole job before the engine's
              # own graceful degradation can apply. Empty (the default) means no
              # secret lookup at all. See databricks.yml for the variables.
              AZURE_OPENAI_ENDPOINT: ${var.azure_openai_endpoint}
              AZURE_OPENAI_API_KEY: ${var.azure_openai_api_key}
              AZURE_OPENAI_DEPLOYMENT_NAME: ${var.azure_openai_deployment}

      # A forecasting run is long; two concurrent runs would contend for the
      # same MLflow experiment and output paths.
      max_concurrent_runs: 1

      queue:
        enabled: true
