# ForecastIQ — TEMPORARY dev-only smoke test (non-DCS, serverless).
#
# WHY SERVERLESS AND NOT A CLASSIC DBR CLUSTER:
# A classic cluster was attempted first and is provably impossible right now.
# The workspace permits only 39 classic node types, and this subscription cannot
# provision ANY of them. Verified two independent ways:
#   1. `az vm list-skus` — all 39 report NotAvailableForSubscription in eastus
#      (and in eastus2 / centralus / westus2).
#   2. A real probe cluster on Standard_D4s_v5 sat PENDING ~9 min then died with
#      CLOUD_PROVIDER_RESOURCE_STOCKOUT / SkuNotAvailable:
#      "Following SKUs have failed for Capacity Restrictions: Standard_D4s_v5".
# Serverless needs no VM from this subscription, so it is the only compute that
# can prove the application chain today.
#
# It proves: DAB -> wheel -> UC Volume -> forecast-engine -> models -> summary.json
# It does NOT prove: Docker image / ACR pull (DCS job's job).
#
# DELETE THIS FILE once DCS is unblocked. The production DCS job in
# forecast_job.yml is untouched and remains the real deployment path.

resources:
  jobs:
    forecast_pipeline_smoke:
      name: ${var.job_name}-smoke
      description: >-
        TEMPORARY non-DCS smoke test on serverless compute. Same wheel, entry
        point and UC paths as the production job.

      parameters:
        - name: dataset
          # Smoke test only: this job exists to prove the chain, so it keeps
          # a concrete default. The production job above has none.
          default: ${var.volumes_root}/store_item_dev.csv
        - name: date_column
          default: date
        - name: target_column
          default: sales
        - name: aggregation_method
          default: sum
        - name: horizon
          default: "12"
        - name: summary_out
          default: ${var.volumes_root}/runs/smoke/{{job.run_id}}/summary.json

      tasks:
        - task_key: run_forecast_pipeline_smoke
          environment_key: forecast_env

          # Identical entry point to the production job.
          python_wheel_task:
            package_name: forecast_engine
            entry_point: forecast-engine
            parameters:
              - --dataset
              - "{{job.parameters.dataset}}"
              - --date-column
              - "{{job.parameters.date_column}}"
              - --target-column
              - "{{job.parameters.target_column}}"
              - --aggregation-method
              - "{{job.parameters.aggregation_method}}"
              - --horizon
              - "{{job.parameters.horizon}}"
              - --summary-out
              - "{{job.parameters.summary_out}}"

      environments:
        - environment_key: forecast_env
          spec:
            client: "3"
            dependencies:
              # Same bundle-built wheel as the production job.
              - ../../dist/*.whl

              # Dependencies the Docker image would otherwise provide. Versions
              # copied verbatim from forecast_engine/requirements.txt — none
              # invented. torch / pytorch-forecasting omitted here ONLY: ~900 MB,
              # and TFT cannot run on this dataset anyway (aggregates to ~36
              # monthly points, below TFT's min_observations of 60), so the engine
              # reports it Unavailable and continues. The DCS image still carries
              # them, so production capability is unchanged.
              - pandas>=2.2,<3.0
              - numpy>=1.26,<2.0
              - scipy>=1.11,<2.0
              - scikit-learn>=1.4,<2.0
              - openpyxl>=3.1,<4.0
              - statsmodels>=0.14,<0.15
              - xgboost-cpu>=2.0,<3.0
              - lightgbm>=4.3,<5.0
              - prophet>=1.1,<2.0
              - shap>=0.45,<0.47
              - openai>=1.30,<2.0
              - mlflow>=2.15,<3.0

      max_concurrent_runs: 1
