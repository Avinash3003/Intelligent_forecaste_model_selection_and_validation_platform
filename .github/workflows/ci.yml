name: CI

# One fast smoke check. The full backend and forecast-engine suites were
# removed deliberately; this runs the single remaining test so a broken
# import still shows up on a PR, without adding minutes to a deploy.
#
# Still exposed as `workflow_call` so the deploy workflows *can* call it,
# but neither does today — both deploy directly.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt pytest

      - name: Run smoke test
        run: pytest tests -q
