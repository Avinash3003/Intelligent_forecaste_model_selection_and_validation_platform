name: Deploy Databricks Bundle (Production)

# Controlled production deployment. Triggers:
#   - a push to main (a merged, reviewed PR)
#   - workflow_dispatch, for a manual trigger from the Actions tab
#
# This workflow deploys the JOB DEFINITIONS only (the Serverless job's code,
# dependencies and config). It never submits a run — `bundle deploy` only
# registers/updates what `jobs run-now` would later execute. A forecast is
# always triggered by a user through the backend (EXECUTION_MODE=databricks
# -> DatabricksRunner -> Jobs API run-now), never by this workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_image_build:
        description: "Rebuild and push the DCS container image even if its inputs did not change"
        type: boolean
        default: false

# Never two production deploys racing each other; never cancel one that's
# already writing to the workspace mid-flight.
concurrency:
  group: deploy-databricks-production
  cancel-in-progress: false

jobs:
  # Stage 1: tests — the identical CI checks (backend, forecast_engine,
  # frontend build, package validation, dev bundle validation), reused via
  # workflow_call rather than duplicated. A deploy never proceeds on code
  # that doesn't pass what every PR is already held to.
  tests:
    name: Tests
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # Stage 2: the DCS container image.
  #
  # Deliberately NOT rebuilt on every deploy. The image carries dependencies
  # only — no application code, which ships in the wheel — so it changes
  # only when the Dockerfile or the engine's requirements change. Those are
  # multi-GB layers (torch, prophet, shap), so rebuilding them on an
  # unrelated code push would add ~20 minutes to every deployment and
  # produce a byte-identical image.
  #
  # Pushes two tags: the commit SHA, so any image can be traced back to the
  # exact source that produced it, and `latest`, which is what the bundle
  # points DCS at — that is what makes a new image picked up automatically
  # without editing a pinned tag by hand.
  build-image:
    name: Build and push DCS image (only when its inputs change)
    needs: tests
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Decide whether the image needs rebuilding
        id: decide
        run: |
          if [ "${{ github.event.inputs.force_image_build }}" = "true" ]; then
            echo "Forced by manual dispatch."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^ HEAD 2>/dev/null || echo "")
          if echo "$changed" | grep -qE '^(Dockerfile|\.dockerignore|forecast_engine/requirements\.txt)$'; then
            echo "Image inputs changed:"; echo "$changed" | grep -E '^(Dockerfile|\.dockerignore|forecast_engine/requirements\.txt)$'
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "No image input changed — reusing the image already in the registry."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: azure/login@v2
        if: steps.decide.outputs.build == 'true'
        with:
          client-id: ${{ secrets.DATABRICKS_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Authenticates docker to the registry using the same service
      # principal everything else uses (it holds AcrPush) — no registry
      # admin user, and no registry password stored in GitHub.
      - name: Sign in to the container registry
        if: steps.decide.outputs.build == 'true'
        run: az acr login --name "$(echo '${{ secrets.ACR_IMAGE }}' | cut -d. -f1)"

      - name: Build and push
        if: steps.decide.outputs.build == 'true'
        run: |
          docker build \
            -t "${{ secrets.ACR_IMAGE }}:${{ github.sha }}" \
            -t "${{ secrets.ACR_IMAGE }}:latest" \
            .
          docker push "${{ secrets.ACR_IMAGE }}:${{ github.sha }}"
          docker push "${{ secrets.ACR_IMAGE }}:latest"

  # Stages 3-5: build the wheel, validate the PRODUCTION target
  # specifically, then deploy it. Every Databricks-facing step in this job
  # names `-t prod` explicitly — nothing here can silently fall back to
  # `dev` (the bundle's `default: true` target), because no step omits
  # `-t`.
  deploy-databricks:
    name: Build, validate and deploy (prod)
    needs: [tests, build-image]
    runs-on: ubuntu-latest
    # A GitHub Environment named "production" — lets this deployment be
    # gated with required reviewers / a wait timer in repo settings without
    # any workflow change, and scopes where the production secrets below
    # are expected to be configured.
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Stage 2: build forecast_engine wheel. The same one-line command
      # databricks.yml's own `artifacts.forecast_engine_wheel.build` runs —
      # built explicitly here so `bundle validate` (which does not invoke
      # the artifact build step itself) has a wheel to check the DCS job's
      # `libraries: whl:` glob against. `bundle deploy` below rebuilds this
      # same wheel again itself; harmless, and identical to what running
      # `databricks bundle deploy` locally already does.
      - name: Build forecast_engine wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist

      - uses: databricks/setup-cli@v1.11.0

      # Stage 3: validate the production target.
      - name: databricks bundle validate -t prod
        working-directory: databricks
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          BUNDLE_VAR_acr_image: ${{ secrets.ACR_IMAGE }}
          BUNDLE_VAR_cicd_service_principal_id: ${{ secrets.DATABRICKS_CLIENT_ID }}
        run: databricks bundle validate -t prod

      # Stage 4/5: deploy — updates both job definitions (Serverless and
      # DCS; DCS stays deployed-but-inactive per the existing subscription
      # limitation, unchanged from before this phase) and uploads the
      # wheel. Never runs the forecast job itself.
      - name: databricks bundle deploy -t prod
        working-directory: databricks
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          BUNDLE_VAR_acr_image: ${{ secrets.ACR_IMAGE }}
          BUNDLE_VAR_cicd_service_principal_id: ${{ secrets.DATABRICKS_CLIENT_ID }}
        run: databricks bundle deploy -t prod

  # App Service deployment is intentionally not part of this workflow yet —
  # the App Service infrastructure doesn't exist. When it does, it becomes
  # its own job here (or its own workflow file, deploy-app-service.yml) after
  # `deploy-databricks`, without restructuring anything above. See
  # docs/ci-cd.md.
